[project]
name = "izlaber-bot"
version = "0.1.0"
description = "Telegram bot based on aiogram 3"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<3.15",
    "aiogram>=3.22,<4.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
