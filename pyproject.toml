[project]
name = "izlaber-bot"
version = "0.1.0"
description = "Telegram bot based on aiogram 3"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<3.15",
    "aiogram>=3.22,<4.0",
    "Django>=5.2,<6.0",
    "django-environ>=0.11,<1.0",
    "djangorestframework>=3.16,<4.0",
    "drf-spectacular>=0.28,<1.0",
    "playwright>=1.54,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-django>=4.9,<5.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["server", "."]
testpaths = ["server/tests", "parsers"]

[tool.setuptools.packages.find]
include = ["bot*", "parsers*"]
exclude = ["server*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
